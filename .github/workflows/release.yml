name: Publish Package

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    # Crucial: Allow the workflow to request the OIDC JWT identity token
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          # CRITICAL: Do NOT set registry-url or always-auth here

      - name: Ensure npm v11.5.1+
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # npm CLI automatically detects the OIDC environment and authenticates
      - name: Publish to npm
        run: npm stage publish
